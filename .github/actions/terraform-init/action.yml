name: Terraform init
description: Garante os buckets de state/backup e inicializa o Terraform com o state remoto do ambiente.
inputs:
  environment:
    description: Ambiente (dev, homolog, prod)
    required: true
runs:
  using: composite
  steps:
    - name: Garantir buckets do state e dos backups
      shell: bash
      run: bash scripts/bootstrap-state.sh

    - name: Instalar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.17.1
        terraform_wrapper: false

    - name: terraform init (state em s3://${{ env.TF_STATE_BUCKET }}/todo-app/${{ inputs.environment }}.tfstate)
      shell: bash
      working-directory: terraform
      run: |
        terraform init \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="key=todo-app/${{ inputs.environment }}.tfstate" \
          -backend-config="region=${AWS_REGION}"
