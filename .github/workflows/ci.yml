# Validação e entrega da aplicação: valida IaC, constrói as imagens, testa o fluxo completo
# com Docker Compose e publica no GHCR com tag identificável (sha-xxxxxxx).
name: CI (validação e imagens)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validar Terraform, Ansible e scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform fmt e validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ansible syntax-check
        working-directory: ansible
        run: |
          pip install --quiet "ansible-core>=2.18,<2.21"
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory/hosts.example.yml playbook.yml --syntax-check
          ansible-playbook -i inventory/hosts.example.yml ops.yml --syntax-check

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  build:
    name: Construir, testar e publicar imagens
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Construir e subir com Docker Compose
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Teste funcional (cadastrar, listar, concluir, reabrir, excluir)
        run: bash scripts/smoke-test.sh http://localhost

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Publicar imagens no GHCR
        if: github.event_name != 'pull_request'
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TAG="sha-${GITHUB_SHA::7}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for svc in backend frontend; do
            for t in "$TAG" latest; do
              docker tag "todo-${svc}:local" "${REGISTRY}/todo-${svc}:${t}"
              docker push --quiet "${REGISTRY}/todo-${svc}:${t}"
            done
          done
          {
            echo "### Imagens publicadas"
            echo "- \`${REGISTRY}/todo-backend:${TAG}\`"
            echo "- \`${REGISTRY}/todo-frontend:${TAG}\`"
            echo ""
            echo "Para implantar esta versão: pipeline **Infraestrutura** com \`app_image_tag = ${TAG}\`"
            echo "Para voltar à versão anterior: rode a mesma pipeline com a tag sha anterior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parar ambiente de teste
        if: always()
        run: docker compose down -v
